<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#121614">
  <title>Offline — VuePresyo</title>
  <style>
    :root {
      --bg: #121614;
      --card: #1b211e;
      --ink: #e8ede9;
      --muted: #8d9891;
      --line: #2a322e;
      --brand: #3fb88a;
      --brand-ink: #0d1210;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      max-width: 400px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }
    .icon {
      font-size: 40px;
      margin-bottom: 12px;
      display: inline-block;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 600;
    }
    p {
      color: var(--muted);
      font-size: 14px;
      margin: 0 0 20px;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px 16px;
      background: var(--brand);
      color: var(--brand-ink);
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      text-decoration: none;
      box-sizing: border-box;
    }
    .btn:active {
      opacity: 0.85;
    }
    .btn-secondary {
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📶</div>
    <h1>You are offline</h1>
    <p>VuePresyo needs an internet connection to load new pages, but you can still access cached pages or view your pending offline scans.</p>
    <a href="/" class="btn">Return to Home</a>
    <button class="btn btn-secondary" onclick="window.location.reload()">Retry Connection</button>
  </div>
</body>
</html>
